# Thymeleaf: sin caché para ver cambios en HTML al instante
spring.thymeleaf.cache=false

# Errores: incluir mensajes explicativos para facilitar la depuración
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

# Niveles de Logging para desarrollo
logging.level.org.example.thymeleaftemplate=DEBUG
logging.level.org.springframework.web=INFO
