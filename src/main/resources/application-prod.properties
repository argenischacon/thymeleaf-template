# ===================================================================
# Perfil: PRODUCCIÓN (prod)
# ===================================================================
# Thymeleaf: caché habilitada para máximo rendimiento
spring.thymeleaf.cache=true

# Seguridad en Errores: no exponer detalles técnicos ni mensajes internos al cliente
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# Compresión HTTP (Gzip) para optimizar transferencia de recursos web
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Niveles de Logging para producción
logging.level.org.example.thymeleaftemplate=INFO
logging.level.org.springframework.web=WARN
