# ===================================================================
# Configuraciones Globales / Comunes
# ===================================================================
spring.application.name=thymeleaf-template
spring.profiles.default=dev

# Plantillas de error: desactiva la página blanca por defecto para usar nuestras vistas personalizadas
spring.web.error.whitelabel.enabled=false
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
