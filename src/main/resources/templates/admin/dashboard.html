<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{fragments/navbar :: admin('dashboard')}, ~{::main})}">
<head>
    <title>Panel de administración</title>
</head>
<body>
<main class="flex-grow-1 container py-4">
    <h1 class="h3 mb-4">Panel de administración</h1>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm h-100"><div class="card-body">
                <p class="text-body-secondary mb-1">Usuarios</p>
                <p class="display-6 mb-0">128</p>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100"><div class="card-body">
                <p class="text-body-secondary mb-1">Roles activos</p>
                <p class="display-6 mb-0">2</p>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100"><div class="card-body">
                <p class="text-body-secondary mb-1">Sesiones hoy</p>
                <p class="display-6 mb-0">34</p>
            </div></div>
        </div>
    </div>
    <p class="small text-body-secondary mt-4">Datos de ejemplo. Esta vista será exclusiva del rol ADMIN.</p>
</main>
</body>
</html>
