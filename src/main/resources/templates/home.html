<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Inicio | Plantilla')}"/>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<header th:replace="~{fragments/navbar :: public}"></header>

<main class="flex-grow-1 container py-5">
    <h1 class="mb-4">Plantilla Spring Boot + Thymeleaf</h1>
    <p class="text-body-secondary">Accesos temporales por rol (se protegerán con Spring Security).</p>
    <div class="row g-3">
        <div class="col-md-6">
            <a class="btn btn-dark w-100 py-3" th:href="@{/admin/dashboard}">Dashboard Administrador</a>
        </div>
        <div class="col-md-6">
            <a class="btn btn-primary w-100 py-3" th:href="@{/user/dashboard}">Dashboard Usuario</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: common}"/>
</body>
</html>
